<style>

*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}main{max-width:1260px;margin:auto;padding:32px 36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow,.spec,.en,.caption,.endpoints{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--muted)}h1{font-size:25px;font-weight:500;margin:9px 0 0}.spec{font-size:11px;color:var(--muted);text-align:right;line-height:1.9}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:40px;align-items:start;padding:30px 0}.stage{min-width:0;position:sticky;top:24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.layout-name{font-size:11px;letter-spacing:1px;color:#bac7b3}button{border:1px solid #3b4736;border-radius:4px;background:#1a2018;color:#bac7b3;padding:10px 12px}button:hover{background:#2a3525;color:#e1efdb}button[aria-pressed=true]{background:#c0ddb1;color:#182414;border-color:#c0ddb1}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}.sim-label{font:10px ui-monospace,monospace;letter-spacing:1.8px;color:#98b18d}.screen-space{display:flex;justify-content:center;align-items:center;min-height:420px;background:#0b0e0b;padding:24px 0}.screen{width:100%;max-width:466px;aspect-ratio:1;border-radius:50%;background:#000}canvas{display:block;width:100%;height:100%}.caption{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:10px;line-height:1.8;margin-top:18px}.panel{min-width:0}.panel-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;font-size:13px;font-weight:500}.panel-title span{font:10px ui-monospace,monospace;letter-spacing:1.5px;color:var(--muted)}.field{margin-bottom:20px}.field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:16px}.field label{font-size:12px}.en{font-size:9px;letter-spacing:1.2px;color:var(--muted);margin-left:6px}.reading{display:flex;align-items:baseline;gap:6px}.reading input{width:64px;border:0;border-bottom:1px solid #43513d;border-radius:0;background:transparent;color:#d7e9ce;text-align:right;padding:2px 0;font:20px ui-monospace,monospace;appearance:textfield}.reading input::-webkit-inner-spin-button,.reading input::-webkit-outer-spin-button{appearance:none}.reading .unit{color:var(--muted);font-size:10px;min-width:27px}input[type=range]{width:100%;height:4px;margin:0;accent-color:var(--green);cursor:pointer}.endpoints{display:flex;justify-content:space-between;color:#7c8a74;font-size:9px;margin-top:7px}.demo{width:100%;padding:13px;font-size:12px;background:#a5ce93;color:#162111;font-weight:600;border-color:#a5ce93}.demo[aria-pressed=true]{background:#293a21;color:#d4eec6;border-color:#557748}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 20px}.presets button{font-size:11px;padding:9px 4px}.options{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}.check{display:flex;gap:8px;align-items:center;font-size:11px;color:#b7c3af;cursor:pointer}.check input{accent-color:var(--green);margin:0;width:14px;height:14px}.note{font-size:11px;line-height:1.8;color:var(--muted);margin:18px 0 0}.footer{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted)}.footer button{font-size:11px;padding:8px 12px}#motionState{color:#bdcdb3}.screen:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;display:flex;align-items:center;justify-content:center;background:#000;border-radius:0}.screen:fullscreen canvas{width:min(100vw,100vh);height:auto;aspect-ratio:1}
@media(max-width:850px){main{padding:24px 20px}.workspace{grid-template-columns:1fr;gap:28px}.stage{position:static}.screen-space{min-height:0;padding:18px 0}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.panel-title,.actions,.options,.note{grid-column:1/-1}.caption{font-size:9px}.spec{font-size:9px}.screen{max-width:466px}.actions{max-width:480px;width:100%;justify-self:center}}

</head>
<body>
<main>
<header><div><div class="eyebrow">MODEL COCKPIT / 04</div><h1>航模 HUD</h1></div><div class="spec">MONOCHROME FLIGHT DISPLAY<br>空速 km/h · 高度 m</div></header>
<div class="workspace">
<section class="stage" aria-label="HUD 表盘预览">
<div class="toolbar"><span class="layout-name">圆形屏 · 466</span><span class="sim-label">SIMULATION</span></div>
<div class="screen-space"><div class="screen" id="screen"><canvas id="hud" width="932" height="932" role="img" aria-label="HUD 模拟仪表">HUD 需要支持 Canvas 的浏览器。</canvas></div></div>
<div class="caption"><span>466 × 466</span><span>顶部航向 / 左侧空速 / 右侧高度 / 底部横滚</span></div>
</section>
<section class="panel" aria-label="模拟飞行参数">
<h2 class="panel-title">模拟飞行参数 <span>FLIGHT CONTROLS</span></h2>
<div id="fields" style="display:contents"></div>
<div class="actions"><button class="demo" id="demo" type="button" aria-pressed="false">开始自动演示</button><div class="presets"><button type="button" data-preset="level">平飞</button><button type="button" data-preset="climb">爬升</button><button type="button" data-preset="turn">右转弯</button></div></div>
<div class="options"><label class="check"><input id="glow" type="checkbox" checked>柔和荧光</label><label class="check"><input id="declutter" type="checkbox">简化显示 · 隐藏辅助数据</label></div>
<p class="note">拖动滑块或输入数值。调整任一参数会暂停演示。数值均为模拟输入。</p>
</section>
</div>
<footer class="footer"><span id="motionState" role="status">手动预览</span><span>0–200 km/h · 0–3,000 m</span><div><button id="reset" type="button">复位</button> <button id="fullscreen" type="button">全屏表盘</button> <button id="save" type="button">保存 PNG</button></div></footer>
</main>
<script>
'use strict';
(() => {
  const config=[
    {key:'speed',label:'空速',en:'IAS',unit:'km/h',min:0,max:200,step:1,value:86},
    {key:'altitude',label:'高度',en:'ALT',unit:'m',min:0,max:3000,step:1,value:275},
    {key:'heading',label:'航向',en:'HDG',unit:'°',min:0,max:359,step:1,value:180},
    {key:'pitch',label:'俯仰',en:'PITCH',unit:'°',min:-45,max:45,step:1,value:5},
    {key:'roll',label:'横滚',en:'ROLL',unit:'°',min:-60,max:60,step:1,value:0},
    {key:'climb',label:'升降率',en:'V/S',unit:'m/s',min:-15,max:15,step:.1,value:1.2}
  ];
  const canvas=document.querySelector('#hud'),ctx=canvas.getContext('2d'),screen=document.querySelector('#screen');
  const demoButton=document.querySelector('#demo'),status=document.querySelector('#motionState');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const defaults=Object.fromEntries(config.map(c=>[c.key,c.value]));
  let target={...defaults},shown={...defaults},origin={...defaults};
  let demo=false,demoTime=0,lastTime=0,frame=0,density=2;
  const counters=Object.fromEntries(['speed','altitude'].map(key=>[key,{from:defaults[key],to:defaults[key],moving:false,phase:0}]));
  const palette={primary:'#00ff00',secondary:'#00c600',minor:'#008c00'};
  const scaleTicks={long:17,short:9,width:1.5};
  const hudFont='ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace';
  const selectedLabel={size:22,weight:'700'};
  let counterBaselineOffset;
  let previewFrames=0,previewSince=0,previewFps=-1;
  const ladderLayer=document.createElement('canvas'),ladderMask=document.createElement('canvas');
  const ladderCtx=ladderLayer.getContext('2d'),maskCtx=ladderMask.getContext('2d');
  const digitShade=document.createElement('canvas');digitShade.width=1;digitShade.height=64;
  const shadeCtx=digitShade.getContext('2d'),shade=shadeCtx.createLinearGradient(0,0,0,64);
  shade.addColorStop(0,'rgba(0,0,0,.9)');shade.addColorStop(.22,'rgba(0,0,0,0)');shade.addColorStop(.78,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(0,0,0,.9)');
  shadeCtx.fillStyle=shade;shadeCtx.fillRect(0,0,1,64);
  const glowControl=document.querySelector('#glow'),declutterControl=document.querySelector('#declutter');
  const controls={},clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wrap=v=>((v%360)+360)%360;
  const delta=(a,b)=>((b-a+540)%360)-180;
  config.forEach(c=>{
    const field=document.createElement('div');field.className='field';
    field.innerHTML=`<div class="field-head"><label for="${c.key}">${c.label}<span class="en">${c.en}</span></label><div class="reading"><input type="number" id="${c.key}Number" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" aria-label="${c.label}数值，${c.unit}"><span class="unit">${c.unit}</span></div></div><input type="range" id="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" aria-label="调整${c.label}"><div class="endpoints"><span>${c.min}</span><span>${c.max} ${c.unit}</span></div>`;
    document.querySelector('#fields').append(field);
    const slider=field.querySelector('[type=range]'),number=field.querySelector('[type=number]');controls[c.key]={slider,number};
    slider.addEventListener('input',()=>setValue(c,Number(slider.value)));
    number.addEventListener('input',()=>{if(number.value!==''&&Number.isFinite(number.valueAsNumber))setValue(c,number.valueAsNumber);});
    number.addEventListener('change',()=>setValue(c,number.valueAsNumber));number.addEventListener('blur',sync);
  });
  function line(points,draw=ctx){draw.beginPath();points.forEach(([x,y],i)=>i?draw.lineTo(x,y):draw.moveTo(x,y));draw.stroke();}
  function text(value,x,y,align='center',size=12,weight='normal',draw=ctx){draw.font=`${weight} ${size}px ${hudFont}`;draw.textAlign=align;draw.textBaseline='middle';const glow=draw.shadowBlur;if(size<=13)draw.shadowBlur=0;draw.fillText(String(value),x,y);draw.shadowBlur=glow;}
  function indexTriangle(tipX,tipY,dx,dy){
    const height=12,halfWidth=6;
    const baseX=tipX-dx*height,baseY=tipY-dy*height;
    ink('primary',1.6);
    line([[tipX,tipY],[baseX-dy*halfWidth,baseY+dx*halfWidth],
      [baseX+dy*halfWidth,baseY-dx*halfWidth],[tipX,tipY]]);
  }
  function geometry(){
    const g={w:466,h:466,cx:233,cy:234,lx:85,rx:381,top:122,bottom:346,tapeCap:34,hy:72,half:104,pitchHalf:80,clipLeft:102,clipRight:364,clipTop:114,clipBottom:350};
    ctx.save();ctx.font=`${selectedLabel.weight} ${selectedLabel.size}px ${hudFont}`;
    // Reserve the largest endpoint label so emphasis never moves the scale.
    const endHalf=Math.max(ctx.measureText('-60').width,ctx.measureText('+60').width)/2;
    ctx.restore();
    g.rollLabelGap=23;
    g.rollRadius=(g.half-endHalf)/Math.sin(Math.PI/3)-g.rollLabelGap;
    g.rollCy=g.cy+186-g.rollRadius;
    // All minor divisions share the physical pitch of a 10-degree bank step.
    g.tickPitch=g.rollRadius*Math.PI/18;
    return g;
  }
  function ink(tone='secondary',width=1.5,draw=ctx){draw.strokeStyle=draw.fillStyle=palette[tone];draw.shadowColor=palette[tone];draw.lineWidth=width;}
  function scaleTick(x,y,dx,dy,major,highlight=false,amount=0){
    ink(highlight?'primary':major?'secondary':'minor',scaleTicks.width+1.7*amount);
    if(!highlight){const green=(major?198:140)+(255-(major?198:140))*amount;ctx.strokeStyle=`rgb(0,${green},0)`;}
    const length=major?scaleTicks.long:scaleTicks.short;
    line([[x,y],[x+dx*length,y+dy*length]]);
  }
  function visibility(distance,span=18){const t=clamp(distance/span,0,1);return t*t*(3-2*t);}
  function labelEmphasis(distance,step){
    const t=clamp(1-Math.abs(distance)/step,0,1);
    return t*t*(3-2*t);
  }
  function scaleLabel(value,x,y,amount,baseSize,baseWeight='normal'){
    const size=baseSize+(selectedLabel.size-baseSize)*amount;
    ctx.save();ctx.shadowBlur=0;ctx.textAlign='center';ctx.textBaseline='middle';
    // Add the two weighted glyph masks on the black dial without a mid-fade dip.
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=palette.primary;
    const opacity=ctx.globalAlpha,weight=.35+.65*amount;
    // Static system fonts cannot interpolate weight: blend both faces instead.
    if(weight<1){
      ctx.font=`${baseWeight} ${size}px ${hudFont}`;
      ctx.globalAlpha=opacity*(1-weight);ctx.fillText(String(value),x,y);
    }
    if(weight>0){
      ctx.font=`${selectedLabel.weight} ${size}px ${hudFont}`;
      ctx.globalAlpha=opacity*weight;ctx.fillText(String(value),x,y);
    }
    ctx.restore();
  }
  function resetCounters(){advanceCounters();}
  function advanceCounters(){
    Object.entries(counters).forEach(([key,c])=>{
      c.from=Math.floor(shown[key]);c.phase=shown[key]-c.from;c.moving=c.phase>0;
      c.to=c.from+(c.moving?1:0);
    });return false;
  }
  function counterDigits(left,x,y,width){
    const c=counters[left?'speed':'altitude'],digits=left?3:4,direction=c.to>=c.from?1:-1;
    const progress=c.phase;
    ctx.save();ctx.beginPath();ctx.rect(x-width/2+3,y-16,width-6,32);ctx.clip();
    ctx.font=`500 26px ${hudFont}`;ctx.textAlign='center';ctx.textBaseline='alphabetic';
    if(counterBaselineOffset===undefined){const metrics=ctx.measureText('0123456789');counterBaselineOffset=(metrics.actualBoundingBoxAscent-metrics.actualBoundingBoxDescent)/2;}
    const previous=String(c.from).padStart(digits,' '),next=String(c.to).padStart(digits,' ');
    let fixed='',outgoing='',incoming='';
    for(let i=0;i<digits;i++){
      const changed=c.moving&&previous[i]!==next[i];
      fixed+=changed?' ':next[i];outgoing+=changed?previous[i]:' ';incoming+=changed?next[i]:' ';
    }
    ctx.fillText(fixed,x,y+counterBaselineOffset);
    if(c.moving){ctx.fillText(outgoing,x,y+counterBaselineOffset+direction*progress*34);
      ctx.fillText(incoming,x,y+counterBaselineOffset-direction*(1-progress)*34);}
    ctx.shadowBlur=0;ctx.drawImage(digitShade,x-width/2+3,y-16,width-6,32);ctx.restore();
  }
  function tape(g,left,value){
    const x=left?g.lx:g.rx,sign=left?-1:1,minor=5,major=20,max=left?200:3000,scale=g.tickPitch/minor;
    const edge=x+sign*g.tapeCap;
    ctx.save();ink();line([[edge,g.top],[x,g.top],[x,g.bottom],[edge,g.bottom]]);
    const lo=Math.max(0,Math.ceil((value-(g.bottom-g.cy)/scale)/minor)*minor),hi=Math.min(max,value+(g.cy-g.top)/scale);
    for(let v=lo;v<=hi+.001;v+=minor){
      const y=g.cy-(v-value)*scale,isMajor=v%major===0;
      if(y<g.top+4||y>g.bottom-4)continue;
      scaleTick(x,y,sign,0,isMajor);
      if(isMajor&&Math.abs(y-g.cy)>33&&y>g.top+15&&y<g.bottom-15){
        ctx.font=`500 18px ${hudFont}`;
        const farX=Math.abs(x+sign*22-g.cx)+ctx.measureText(String(v)).width+2,farY=Math.abs(y-233)+13;
        const edge=Math.min(y-(g.top+15),(g.bottom-15)-y,Math.abs(y-g.cy)-33);
        const opacity=visibility(edge)*visibility((231*231-farX*farX-farY*farY)/(2*231),14);
        if(opacity>0){ctx.save();ctx.globalAlpha*=opacity;ink('primary');text(v,x+sign*22,y,left?'right':'left',18,'500');ctx.restore();}
      }
    }
    const inner=x+sign*9,outer=inner+sign*72,halfHeight=20,bevel=2;
    ink('primary',1.6);
    ctx.beginPath();ctx.moveTo(x,g.cy);ctx.lineTo(inner,g.cy-halfHeight);ctx.lineTo(outer-sign*bevel,g.cy-halfHeight);ctx.lineTo(outer,g.cy-halfHeight+bevel);ctx.lineTo(outer,g.cy+halfHeight-bevel);ctx.lineTo(outer-sign*bevel,g.cy+halfHeight);ctx.lineTo(inner,g.cy+halfHeight);ctx.closePath();
    ctx.save();ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.fill();ctx.restore();ctx.stroke();
    counterDigits(left,(inner+outer)/2,g.cy,Math.abs(outer-inner));
    if(!declutterControl.checked){ink('primary');text(left?'KM/H':'M',x+sign*g.tapeCap/2,g.top-18,'center',14,'500');}
    ctx.restore();
  }
  function heading(g){
    ctx.save();ink();
    const raw=shown.heading,minor=5,spacing=g.tickPitch/minor;
    const left=g.cx-g.half,right=g.cx+g.half,labelHalf=g.half-24;
    const direction=bearing=>['N','E','S','W'][Math.round(wrap(bearing)/90)%4];
    // Fixed end labels point to the nearest cardinal beyond the readable tape.
    const leftCardinal=Math.floor((raw-labelHalf/spacing)/90)*90;
    const rightCardinal=Math.ceil((raw+labelHalf/spacing)/90)*90;
    const extent=g.half/spacing;
    for(let v=Math.floor((raw-extent)/minor)*minor;v<=raw+extent;v+=minor){
      const x=g.cx+(v-raw)*spacing;if(x<left+1||x>right-1)continue;
      const degrees=Math.round(wrap(v)),cardinal=degrees%90===0?direction(degrees):null;
      const major=degrees%20===0||!!cardinal;
      scaleTick(x,g.hy,0,-1,major,!!cardinal,labelEmphasis(v-raw,5));
      if(major&&(cardinal||(degrees%90!==10&&degrees%90!==80))){
        const label=cardinal||degrees,baseSize=20,amount=labelEmphasis(v-raw,20);
        const size=baseSize+(selectedLabel.size-baseSize)*amount;
        ctx.font=`${selectedLabel.weight} ${size}px ${hudFont}`;
        const halfWidth=ctx.measureText(String(label)).width/2;
        const opacity=visibility(labelHalf-Math.abs(x-g.cx)-halfWidth);
        if(opacity>0){ctx.save();ctx.globalAlpha*=opacity;scaleLabel(label,x,g.hy-28,amount,baseSize,cardinal?'500':'normal');ctx.restore();}
      }
    }
    ink('primary');
    text(direction(leftCardinal),left,g.hy-28,'left',20,'500');
    text(direction(rightCardinal),right,g.hy-28,'right',20,'500');
    indexTriangle(g.cx,g.hy+5,0,-1);
    ctx.restore();
  }
  function prepareLadderMask(g){
    const w=g.clipRight-g.clipLeft,h=g.clipBottom-g.clipTop;
    ladderLayer.width=ladderMask.width=Math.round(w*density);
    ladderLayer.height=ladderMask.height=Math.round(h*density);
    maskCtx.setTransform(density,0,0,density,0,0);
    const horizontal=maskCtx.createLinearGradient(0,0,w,0);
    horizontal.addColorStop(0,'transparent');horizontal.addColorStop(14/w,'#fff');horizontal.addColorStop(1-14/w,'#fff');horizontal.addColorStop(1,'transparent');
    maskCtx.fillStyle=horizontal;maskCtx.fillRect(0,0,w,h);
    maskCtx.globalCompositeOperation='destination-in';
    const vertical=maskCtx.createLinearGradient(0,0,0,h);
    vertical.addColorStop(0,'transparent');vertical.addColorStop(14/h,'#fff');vertical.addColorStop(1-14/h,'#fff');vertical.addColorStop(1,'transparent');
    maskCtx.fillStyle=vertical;maskCtx.fillRect(0,0,w,h);maskCtx.globalCompositeOperation='source-over';
  }
  function ladder(g){
    const draw=ladderCtx,w=g.clipRight-g.clipLeft,h=g.clipBottom-g.clipTop;
    draw.setTransform(1,0,0,1,0,0);draw.clearRect(0,0,ladderLayer.width,ladderLayer.height);
    draw.setTransform(density,0,0,density,-g.clipLeft*density,-g.clipTop*density);
    draw.lineJoin='round';draw.lineCap='butt';draw.shadowColor=palette.primary;draw.shadowBlur=glowControl.checked ? 0.9*density : 0;
    const angle=-shown.roll*Math.PI/180,cs=Math.cos(angle),sn=Math.sin(angle);
    draw.save();draw.translate(g.cx,g.cy);draw.rotate(angle);
    const readableLabels=[];
    function labelVisible(value,x,y,align){
      draw.font=`500 20px ${hudFont}`;
      draw.textAlign=align;draw.textBaseline='middle';
      const metrics=draw.measureText(String(value)),margin=1;
      const left=x-metrics.actualBoundingBoxLeft-margin,right=x+metrics.actualBoundingBoxRight+margin;
      const top=y-metrics.actualBoundingBoxAscent-margin,bottom=y+metrics.actualBoundingBoxDescent+margin;
      for(const [px,py] of [[left,top],[right,top],[right,bottom],[left,bottom]]){
        const sx=g.cx+cs*px-sn*py,sy=g.cy+sn*px+cs*py;
        if(sx<g.clipLeft+1||sx>g.clipRight-1||sy<g.clipTop+1||sy>g.clipBottom-1)return false;
      }
      return true;
    }
    for(let p=-90;p<=90;p+=5){
      const y=(shown.pitch-p)*12;if(Math.abs(y)>260)continue;
      const major=p%10===0,half=major?g.pitchHalf:48;
      ink(p===0?'primary':'secondary',1.5,draw);
      draw.setLineDash(p<0?[8,5]:[]);draw.lineDashOffset=p<0?4-half:0;
      line([[-half,y],[half,y]],draw);draw.setLineDash([]);draw.lineDashOffset=0;
      const hook=p<0?-6:6;
      line([[-half,y],[-half,y+hook]],draw);line([[half,y],[half,y+hook]],draw);
      for(const [x,align] of [[-half-4,'right'],[half+4,'left']]){
        if(labelVisible(p,x,y,align))readableLabels.push([p,x,y,align]);
      }
      draw.globalAlpha=1;
    }
    draw.restore();draw.setTransform(1,0,0,1,0,0);draw.shadowBlur=0;
    draw.globalCompositeOperation='destination-in';draw.drawImage(ladderMask,0,0);draw.globalCompositeOperation='source-over';
    // Only the lines fade at the clipping boundary; complete digits stay crisp.
    draw.setTransform(density,0,0,density,-g.clipLeft*density,-g.clipTop*density);
    draw.save();draw.translate(g.cx,g.cy);draw.rotate(angle);ink('primary',1.5,draw);draw.shadowBlur=0;
    for(const [p,x,y,align] of readableLabels)text(p,x,y,align,20,'500',draw);
    draw.restore();draw.setTransform(1,0,0,1,0,0);
    ctx.save();ctx.shadowBlur=0;ctx.drawImage(ladderLayer,g.clipLeft,g.clipTop,w,h);ctx.restore();
  }
  function marker(g){
    ctx.save();ink('primary',1.6);
    const ring=14;
    ctx.beginPath();ctx.arc(g.cx,g.cy,ring,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(g.cx,g.cy,7.5,0,Math.PI*2);ctx.stroke();
    line([[g.cx-38,g.cy],[g.cx-ring,g.cy]]);line([[g.cx+ring,g.cy],[g.cx+38,g.cy]]);line([[g.cx,g.cy-ring],[g.cx,g.cy-28]]);
    ctx.restore();
  }
  function bank(g){
    ctx.save();ink();
    const radius=g.rollRadius,cy=g.rollCy,labelGap=g.rollLabelGap;
    const roll=clamp(shown.roll,-60,60);
    const point=(degrees,r)=>{const a=degrees*Math.PI/180;return [g.cx+Math.sin(a)*r,cy+Math.cos(a)*r];};
    for(let value=-60;value<=60;value+=10){
      const major=value%30===0,angle=value*Math.PI/180,[tickX,tickY]=point(value,radius);
      scaleTick(tickX,tickY,-Math.sin(angle),-Math.cos(angle),major,false,labelEmphasis(value-roll,10));
      if(major){
        const [x,y]=point(value,radius+labelGap);
        scaleLabel(value>0?'+'+value:value,x,y,labelEmphasis(value-roll,30),20);
      }
    }
    const a=roll*Math.PI/180;
    const [tipX,tipY]=point(roll,radius-25);
    indexTriangle(tipX,tipY,Math.sin(a),Math.cos(a));
    ctx.restore();
  }
  // Same 5x7 glyphs, 2x scaling and opaque badge as firmware FpsOverlay.
  function fpsOverlay(){
    const glyphs=[
      [0x3e,0x51,0x49,0x45,0x3e],[0,0x42,0x7f,0x40,0],
      [0x42,0x61,0x51,0x49,0x46],[0x21,0x41,0x45,0x4b,0x31],
      [0x18,0x14,0x12,0x7f,0x10],[0x27,0x45,0x45,0x45,0x39],
      [0x3c,0x4a,0x49,0x49,0x30],[1,0x71,9,5,3],
      [0x36,0x49,0x49,0x49,0x36],[6,0x49,0x49,0x29,0x1e]];
    const letters={F:[0x7f,9,9,9,1],P:[0x7f,9,9,9,6],S:[0x46,0x49,0x49,0x49,0x31],'.':[0,0x60,0x60,0,0],'-':[8,8,8,8,8]};
    const value=(previewFps<0?'--.-':Math.min(99.9,previewFps).toFixed(1).padStart(4,' '))+' FPS';
    ctx.save();ctx.shadowBlur=0;ctx.fillStyle='#080808';ctx.fillRect(181,432,104,22);ctx.fillStyle='#fff';
    [...value].forEach((c,i)=>{const bits=glyphs[c]||letters[c]||[];
      for(let x=0;x<5;x++)for(let y=0;y<7;y++)if(bits[x]&(1<<y))ctx.fillRect(185+i*12+x*2,436+y*2,2,2);
    });ctx.restore();
  }
  function paint(){
    const g=geometry();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(density,0,0,density,0,0);ctx.save();
    ctx.beginPath();ctx.arc(233,233,233,0,Math.PI*2);ctx.clip();
    ctx.fillStyle='#000';ctx.fillRect(0,0,g.w,g.h);ink();ctx.lineJoin='round';ctx.lineCap='butt';
    ctx.shadowColor='#00ff00';ctx.shadowBlur=glowControl.checked ? 0.9*density : 0;
    heading(g);tape(g,true,shown.speed);tape(g,false,shown.altitude);ladder(g);marker(g);bank(g);
    fpsOverlay();
    if(!declutterControl.checked){
      ink();const x=g.rx+g.tapeCap/2;text((shown.climb>=0?'+':'')+shown.climb.toFixed(1),x,g.bottom+22,'center',14);text('V/S',x,g.bottom+36,'center',12);
    }
    ctx.restore();
  }
  function sync(){
    config.forEach(c=>{let v=c.key==='heading'?Math.round(wrap(target[c.key]))%360:target[c.key];const value=c.step<1?v.toFixed(1):String(Math.round(v));controls[c.key].slider.value=value;controls[c.key].number.value=value;});
    canvas.setAttribute('aria-label',`HUD 模拟：空速 ${Math.round(target.speed)} 千米每小时，高度 ${Math.round(target.altitude)} 米，航向 ${Math.round(wrap(target.heading))%360} 度，俯仰 ${Math.round(target.pitch)} 度，横滚 ${Math.round(target.roll)} 度，升降率 ${target.climb.toFixed(1)} 米每秒`);
  }
  function stop(){demo=false;demoButton.setAttribute('aria-pressed','false');demoButton.textContent='开始自动演示';status.textContent='手动预览';}
  function queue(){if(!frame&&!document.hidden)frame=requestAnimationFrame(tick);}
  function tick(now){
    frame=0;
    if(!lastTime){previewFrames=0;previewSince=now;previewFps=-1;}
    else if(now-previewSince>=1000){previewFps=previewFrames*1000/(now-previewSince);previewFrames=0;previewSince=now;}
    ++previewFrames;
    const dt=lastTime?Math.min((now-lastTime)/1000,.05):1/60;lastTime=now;
    if(demo){demoTime+=dt;const t=demoTime,b=1-Math.exp(-t*1.2);const values={speed:86+16*Math.sin(t*.35),altitude:275+55*Math.sin(t*.2),heading:wrap(origin.heading+18*Math.sin(t*.15)),pitch:5+8*Math.sin(t*.3),roll:25*Math.sin(t*.4),climb:11*Math.cos(t*.2)};
      config.forEach(c=>{target[c.key]=c.key==='heading'?wrap(origin.heading+delta(origin.heading,values.heading)*b):origin[c.key]+(values[c.key]-origin[c.key])*b;});sync();
    }
    let moving=false;config.forEach(c=>{const d=c.key==='heading'?delta(shown[c.key],target[c.key]):target[c.key]-shown[c.key];if(Math.abs(d)>.01){shown[c.key]+=d*(reduced.matches&&!demo?1:1-Math.exp(-dt*16));if(c.key==='heading')shown.heading=wrap(shown.heading);moving=true;}else shown[c.key]=target[c.key];});
    const counterMoving=advanceCounters();
    paint();if(demo||moving||counterMoving)queue();else lastTime=0;
  }
  function setValue(c,value){if(!Number.isFinite(value)){sync();return;}stop();target[c.key]=Math.round(clamp(value,c.min,c.max)/c.step)*c.step;sync();queue();}
  function resize(){const g=geometry(),bounds=canvas.getBoundingClientRect();density=Math.max(1,Math.min(4,bounds.width*(devicePixelRatio||1)/g.w));canvas.width=Math.round(g.w*density);canvas.height=Math.round(g.h*density);prepareLadderMask(g);paint();}
  function preset(name){stop();const presets={level:{...defaults,pitch:0,roll:0,climb:0},climb:{...defaults,speed:92,pitch:15,climb:5},turn:{...defaults,heading:210,pitch:3,roll:30,climb:0}};target={...presets[name]};sync();queue();}
  demoButton.addEventListener('click',()=>{if(demo){stop();return;}demo=true;demoTime=0;origin={...shown};target={...shown};lastTime=0;demoButton.setAttribute('aria-pressed','true');demoButton.textContent='暂停自动演示';status.textContent='自动演示中';queue();});
  document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>preset(button.dataset.preset)));
  ['glow','declutter'].forEach(id=>document.querySelector('#'+id).addEventListener('change',paint));
  document.querySelector('#reset').addEventListener('click',()=>{stop();target={...defaults};shown={...defaults};resetCounters();sync();paint();});
  document.querySelector('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await screen.requestFullscreen();}catch{status.textContent='浏览器未允许全屏，请使用窗口放大预览';}});
  document.addEventListener('fullscreenchange',()=>{document.querySelector('#fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏表盘';resize();});
  document.querySelector('#save').addEventListener('click',()=>{const g=geometry(),out=document.createElement('canvas');out.width=g.w;out.height=g.h;out.getContext('2d').drawImage(canvas,0,0,g.w,g.h);out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='hud-466-round.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;lastTime=0;}else if(demo||config.some(c=>shown[c.key]!==target[c.key]))queue();});
  new ResizeObserver(resize).observe(screen);sync();resize();
})();
</script>
</body>
</html>
