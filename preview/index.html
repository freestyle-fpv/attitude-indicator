<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>姿态仪 · 466 × 466</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111414;color:#edf0e9}
*{box-sizing:border-box}body{margin:0}main{max-width:1140px;margin:auto;padding:44px 40px 32px}header{border-bottom:1px solid #303733;padding-bottom:24px;display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#a6b3a8;font-size:11px;letter-spacing:3px}.title{font-size:25px;font-weight:500;margin:10px 0 0}.hardware{font:11px monospace;color:#91a396;text-align:right;line-height:1.8}.workspace{display:grid;grid-template-columns:minmax(350px,1fr) 300px;gap:68px;align-items:center;padding:42px 0}.instrument{width:100%;height:auto;max-width:580px;aspect-ratio:1;display:block;border-radius:50%;background:#050707;box-shadow:0 18px 50px #0008}.caption{display:flex;justify-content:space-between;margin-top:24px;color:#8e9c94;font-size:11px;letter-spacing:1px}.control{margin-bottom:34px}.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}.value{font-size:25px;font-weight:400;font-variant-numeric:tabular-nums}.en{display:block;font:10px monospace;letter-spacing:2px;color:#8e9c94;margin-top:6px}input[type=range]{width:100%;accent-color:#f7df4c;margin:20px 0 8px;height:4px}.range{display:flex;justify-content:space-between;font:10px monospace;color:#6e8074}.presets{display:flex;gap:8px;margin:4px 0 30px}button{border:1px solid #3d483f;background:#1c231e;color:#d4dfd4;border-radius:5px;padding:10px 12px;cursor:pointer;font:12px inherit}button:hover{background:#2e3930}button:focus-visible,input:focus-visible{outline:2px solid #f7df4c;outline-offset:5px}.demo{width:100%;padding:15px;background:#ebd955;color:#20231a;border:0;font-weight:600}.demo[aria-pressed=true]{background:#4a5849;color:#f2f5ed}.note{font-size:12px;line-height:1.9;color:#86968a;margin-top:20px}.footer{border-top:1px solid #303733;padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;color:#849488}#status{color:#bed0bc}#status.error{color:#ff897c}.download{padding:8px 10px;font-size:11px}@media(max-width:800px){main{padding:24px}.workspace{grid-template-columns:1fr;gap:34px;padding:30px 0}.instrument{margin:auto;max-width:500px}.panel{max-width:500px;width:100%;margin:auto}.hardware{font-size:9px}.title{font-size:21px}.footer{flex-wrap:wrap}}
</style>
<main>
<header><div><div class="eyebrow">MODEL COCKPIT / 01</div><h1 class="title">圆形姿态仪</h1></div><div class="hardware">ESP32-S3 · AMOLED 1.75″<br>466 × 466 PX</div></header>
<div class="workspace">
<section aria-label="姿态显示预览"><img class="instrument" id="instrument" alt="完整圆形姿态仪：蓝色天空、棕色地面、白色刻度及黄色飞机标" width="466" height="466"><div class="caption"><span>完整圆形 · 代码绘制</span><span>UI PREVIEW</span></div></section>
<section class="panel" aria-label="预览控制">
<div class="control"><div class="row"><label for="pitch">俯仰<span class="en">PITCH</span></label><output class="value" id="pitchValue" for="pitch">−17°</output></div><input id="pitch" type="range" min="-90" max="90" step="1" value="-17"><div class="range"><span>−90°</span><span>0°</span><span>+90°</span></div></div>
<div class="control"><div class="row"><label for="roll">横滚<span class="en">ROLL</span></label><output class="value" id="rollValue" for="roll">−2°</output></div><input id="roll" type="range" min="-180" max="180" step="1" value="-2"><div class="range"><span>−180°</span><span>0°</span><span>+180°</span></div></div>
<div class="presets"><button data-pitch="0" data-roll="0">水平</button><button data-pitch="-17" data-roll="-2">参考姿态</button><button data-pitch="12" data-roll="30">右滚抬头</button></div>
<button class="demo" id="demo" aria-pressed="false">开始自动演示</button>
<p class="note">飞机标保持固定，天空与地面随姿态运动。<br>此处可调节预览；开发板使用自身传感器。</p>
</section></div>
<footer class="footer"><span id="status" role="status">正在绘制…</span><span>与固件共用 C++ 渲染器</span><button class="download" id="save">保存 PNG</button></footer>
</main>
<script>
const pitch=document.querySelector('#pitch'),roll=document.querySelector('#roll'),picture=document.querySelector('#instrument'),status=document.querySelector('#status'),demoButton=document.querySelector('#demo');
let demo=false,busy=false,dirty=true,start=0,currentUrl=null;
function label(v){return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(0)+'°'}
function update(){document.querySelector('#pitchValue').value=label(+pitch.value);document.querySelector('#rollValue').value=label(+roll.value);dirty=true}
function stopDemo(){demo=false;demoButton.setAttribute('aria-pressed','false');demoButton.textContent='开始自动演示'}
for(const input of [pitch,roll])input.addEventListener('input',()=>{stopDemo();update()});
document.querySelectorAll('[data-pitch]').forEach(button=>button.addEventListener('click',()=>{stopDemo();pitch.value=button.dataset.pitch;roll.value=button.dataset.roll;update()}));
demoButton.addEventListener('click',()=>{if(demo){stopDemo()}else{demo=true;start=performance.now();demoButton.setAttribute('aria-pressed','true');demoButton.textContent='暂停演示'}});
async function render(){if(busy||!dirty)return;busy=true;dirty=false;const t=performance.now();try{const response=await fetch('/frame?pitch='+pitch.value+'&roll='+roll.value);if(!response.ok)throw Error('渲染器暂不可用');const blob=await response.blob(),url=URL.createObjectURL(blob);await new Promise((resolve,reject)=>{picture.onload=resolve;picture.onerror=reject;picture.src=url});if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=url;status.classList.remove('error');status.textContent='预览就绪 · '+Math.round(performance.now()-t)+' ms'}catch(e){status.textContent='预览失败，请检查本地服务';status.classList.add('error')}finally{busy=false}}
setInterval(()=>{if(document.hidden)return;if(demo){const t=(performance.now()-start)/1000;pitch.value=Math.round(20*Math.sin(t*.5));roll.value=Math.round(40*Math.sin(t*.31));update()}render()},80);
document.querySelector('#save').addEventListener('click',()=>{if(!picture.complete||!picture.naturalWidth)return;const canvas=document.createElement('canvas');canvas.width=canvas.height=466;canvas.getContext('2d').drawImage(picture,0,0);canvas.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='attitude-indicator.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})});
update();render();
</script>
</html>
